services:
  hookloot-api:
    build:
      context: ../..
      dockerfile: server/Dockerfile
    container_name: hookloot-api
    restart: unless-stopped
    env_file:
      - /opt/hookloot/.env.production
    environment:
      HOOKLOOT_API_PORT: 8787
      HOOKLOOT_DATA_DIR: /data
    volumes:
      - /opt/hookloot/data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8787/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - hookloot_net

  hookloot-web:
    image: nginx:1.27-alpine
    container_name: hookloot-web
    restart: unless-stopped
    depends_on:
      hookloot-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${HOOKLOOT_BIND_PORT:-18181}:80"
    volumes:
      - /opt/hookloot/current/dist:/usr/share/nginx/html:ro
      - /opt/hookloot/current/deploy/vps/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    networks:
      - hookloot_net

networks:
  hookloot_net:
    name: hookloot_net

limit_req_zone $binary_remote_addr zone=hookloot_edge_per_ip:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=hookloot_player_actions_per_ip:10m rate=30r/m;

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  limit_req_status 429;
  limit_req_log_level warn;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location = /api/edge/player-actions {
    if ($request_method !~ ^(POST|OPTIONS)$) {
      return 405;
    }

    limit_req zone=hookloot_player_actions_per_ip burst=20 nodelay;
    proxy_pass http://hookloot-api:8787/api/edge/player-actions;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /api/edge/ {
    if ($request_method !~ ^(POST|OPTIONS)$) {
      return 405;
    }

    limit_req zone=hookloot_edge_per_ip burst=30 nodelay;
    proxy_pass http://hookloot-api:8787/api/edge/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /api/ {
    proxy_pass http://hookloot-api:8787/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
